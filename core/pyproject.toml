[project]
name = "papiro-core"
version = "1.1.0"
description = "Nucleo PAPIRO SOBERANO - MCP papiro (38) + papiro-seguranca (10), portoes G1-G11, CLI espelho"
requires-python = ">=3.12"
dependencies = [
  "pymupdf>=1.27,<1.29",
  "pymupdf4llm>=1.27",
  "pikepdf>=10.0",
  "pypdf>=6.0",
  "pdfplumber>=0.11",
  "pypdfium2>=5.0",
  "pillow>=11.0",
  "segno>=1.6",
  "openpyxl>=3.1",
  "pydantic>=2.0",
  "typer>=0.15",
  "rich>=13.0",
  "pyyaml>=6.0",
  "img2pdf>=0.5",
  "mcp>=1.20,<2",
  "structlog>=24.0",
  "watchdog>=4.0",
  "numpy>=2.0",
  "opencv-python-headless>=4.10",
  "markdown-it-py>=3.0",
  "fonttools>=4.50",
  "jsonschema>=4.20",
]

[project.optional-dependencies]
ocr = ["ocrmypdf>=17"]
seguranca = ["pyhanko>=0.30", "pyhanko-certvalidator>=0.26", "qrcode>=8", "keyring>=25", "cryptography>=43"]
lgpd = ["presidio-analyzer>=2.2", "spacy>=3.8"]
dev = ["pytest>=8", "pytest-cov>=5", "hypothesis>=6"]

[project.scripts]
papiro = "papiro_core.cli:app_run"
papiro-mcp = "papiro_core.mcp_server:main"
papiro-seguranca-mcp = "papiro_core.mcp_seguranca:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["papiro_core*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["papiro_core"]
